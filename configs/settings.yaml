# Manifesto de referência (nenhum loader lê este arquivo; thresholds efetivos
# estão em agent_quality_guard/core/schemas.py e agent_quality_guard/mcp_server.py).
#
# Sanitizado no Portão 2: sem referências legadas a engines neurais locais,
# hardware específico de estação nem endpoints de terceiros.

hardware:
  # Parâmetros genéricos de execução determinística (sem alvo de GPU fixo).
  allow_gpu: false             # O gate é 100% determinístico e roda em CPU
  cpu_only: true
  max_sequence_length: 1024    # Janela compacta para buffers de contexto
  cpu_fallback: true           # Sempre seguro: nada depende de aceleração

search:
  # Busca cirúrgica híbrida (Ripgrep léxico + Needle AST + RRF).
  default_max_tokens: 1000
  default_relational_depth: 2
  timeout_seconds: 10.0

orchestrator:
  subagent_roles:
    - "backend"
    - "frontend"
    - "security"
    - "devops"
    - "documentation"
  guardrails:
    # Avaliações probabilísticas (noul/score) aposentadas pelo TICKET-HARNESS-47:
    # a homologação é determinística (Pytest real + AST Guard + toolchain/AST).
    require_deterministic_gate: true
