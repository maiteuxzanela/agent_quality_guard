# Configuração da Arquitetura Tri-Camada (Needle 3 + Open Jev + LLM)

hardware:
  # Alvo: NVIDIA GeForce GTX 1050 Ti (4096 MiB total)
  target_gpu: "GeForce GTX 1050 Ti"
  max_vram_mb: 3000          # Limite de segurança de VRAM em MB (deixa margem para o display manager)
  disallow_bfloat16: true    # Trava mandatória para arquitetura Pascal (sm_61 não suporta bfloat16)
  force_dtype: "float16"     # "float16" ou "float32"
  max_sequence_length: 1024  # Janela compacta para evitar CUDA OOM
  cpu_fallback: true         # Permite offload seguro para CPU caso a VRAM seja disputada

openjev:
  model_id: "com-kotobalabs/open-jev-deberta-v3-large"
  server_host: "0.0.0.0"
  server_port: 8005
  timeout_seconds: 15.0
  thresholds:
    noul_default: 0.5
    noul_guardrail_critical: 0.85
    score_default_pass: 4.0

needle3:
  api_endpoint: "https://api.cactuscompute.com/v1"
  default_max_tokens: 1500
  default_relational_depth: 2
  timeout_seconds: 10.0

orchestrator:
  subagent_roles:
    - "backend"
    - "frontend"
    - "security"
    - "devops"
    - "documentation"
  guardrails:
    require_noul_before_destructive_tool: true
    min_guardrail_probability: 0.85
  evaluation:
    require_score_before_merge: true
    min_score_required: 4.0
